name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Never cancel a main run that may be deploying the Worker.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  API_ENDPOINT: "https://cl.dryk.net"

# The verification jobs run in parallel and never cancel each other, so one run reports every
# broken job. Rulesets require only `CI Check Result`, which keeps them independent of the job list.
jobs:
  check:
    name: code quality check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require develop as the source of main pull requests
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [[ "$HEAD_BRANCH" != "develop" || "$HEAD_REPOSITORY" != "$GITHUB_REPOSITORY" ]]; then
            echo "::error title=Invalid promotion source::Pull requests into main must come from this repository's develop branch."
            exit 1
          fi

      - &checkout
        name: Check out the repository
        uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false

      - &reject-environment-files
        name: Reject environment files
        run: |
          blocked_path="$(find . -path './.git' -prune -o \( -name '.env' -o -name '.env.*' -o -name '.dev.vars' -o -name '.dev.vars.*' \) ! -name '*.example' -print -quit)"
          if [[ -n "$blocked_path" ]]; then
            echo "::error title=Environment file in checkout::$blocked_path must not be present in the repository."
            exit 1
          fi

      - &install-pnpm
        name: Install pnpm
        uses: pnpm/action-setup@v6.0.9

      - &set-up-node
        name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - &install-dependencies
        name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify generated popup routes
        run: |
          pnpm -C apps/browser-extension routes:generate
          git ls-files --error-unmatch apps/browser-extension/entrypoints/popup/routeTree.gen.ts
          git diff --exit-code -- apps/browser-extension/entrypoints/popup/routeTree.gen.ts

      - name: Verify the workflow lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh extension install github/gh-actions-lock --pin v0.2.0
          gh actions-lock --verify

      - name: Check format, lint, and types
        run: pnpm check

  unit:
    name: testing (unit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      has-coverage: ${{ steps.upload-coverage.outcome == 'success' }}
    steps:
      - *checkout
      - *reject-environment-files
      - *install-pnpm
      - *set-up-node
      - *install-dependencies

      - name: Test with coverage
        run: pnpm test:coverage

      # Reporting is auxiliary, so an upload failure only skips the coverage comment.
      - name: Upload coverage
        id: upload-coverage
        if: ${{ !cancelled() && hashFiles('coverage/coverage-summary.json') != '' }}
        continue-on-error: true
        uses: actions/upload-artifact@v7.0.1
        with:
          name: unit-coverage
          path: |
            coverage/coverage-summary.json
            coverage/coverage-final.json
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  # Holds the pull request write token apart from the job that runs dependency code.
  coverage-report:
    name: coverage report
    needs: unit
    if: ${{ !cancelled() && needs.unit.outputs.has-coverage == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - *checkout

      - name: Download coverage
        uses: actions/download-artifact@v8.0.2
        with:
          name: unit-coverage
          path: coverage

      # Fork pull requests get a read-only token, so they only see the job summary.
      - name: Report coverage
        uses: davelosert/vitest-coverage-report-action@v2.13.0
        with:
          comment-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) && 'pr' || 'none' }}

  integration:
    name: testing (integration)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - *checkout
      - *reject-environment-files
      - *install-pnpm
      - *set-up-node
      - *install-dependencies

      - &install-playwright-browsers
        name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Test integration
        run: pnpm test:integration

  e2e:
    name: testing (e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - *checkout
      - *reject-environment-files
      - *install-pnpm
      - *set-up-node
      - *install-dependencies
      - *install-playwright-browsers

      - name: Test built Chrome extension
        run: pnpm test:e2e

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - *checkout
      - *reject-environment-files
      - *install-pnpm
      - *set-up-node
      - *install-dependencies

      - name: Build
        run: pnpm build

  result:
    name: CI Check Result
    needs:
      - check
      - unit
      - integration
      - e2e
      - build
    # A skipped required check counts as passing, so this job must run and fail on its own.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every verification job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failed_jobs="$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key): \(.value.result)"' <<<"$NEEDS")"
          if [[ -n "$failed_jobs" ]]; then
            echo "::error title=CI failed::The following jobs did not succeed: $(paste -sd ',' <<<"$failed_jobs")"
            exit 1
          fi

  deploy:
    name: deploy Worker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'dorayaki4369/currency-lens'
    needs: result
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: worker-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://cl.dryk.net
    steps:
      - *checkout
      - *reject-environment-files
      - *install-pnpm
      - *set-up-node
      - *install-dependencies

      - name: Require the current main commit
        run: |
          main_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$main_sha" != "$GITHUB_SHA" ]]; then
            echo "::error title=Stale deployment source::$GITHUB_SHA is no longer the main HEAD ($main_sha). Deploy from the newest main run instead."
            exit 1
          fi

      - name: Deploy the Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [[ -z "$CLOUDFLARE_ACCOUNT_ID" || -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error title=Missing Cloudflare credentials::Configure the production environment secrets."
            exit 1
          fi

          pnpm --filter @cl/server run deploy
