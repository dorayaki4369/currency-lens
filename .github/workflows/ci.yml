name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Never cancel a main run that may be deploying the Worker.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  API_ENDPOINT: "https://cl.dryk.net"

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require develop as the source of main pull requests
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [[ "$HEAD_BRANCH" != "develop" || "$HEAD_REPOSITORY" != "$GITHUB_REPOSITORY" ]]; then
            echo "::error title=Invalid promotion source::Pull requests into main must come from this repository's develop branch."
            exit 1
          fi

      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reject environment files
        run: |
          blocked_path="$(find . -path './.git' -prune -o \( -name '.env' -o -name '.env.*' -o -name '.dev.vars' -o -name '.dev.vars.*' \) ! -name '*.example' -print -quit)"
          if [[ -n "$blocked_path" ]]; then
            echo "::error title=Environment file in checkout::$blocked_path must not be present in the repository."
            exit 1
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify generated popup routes
        run: |
          pnpm -C apps/browser-extension routes:generate
          git ls-files --error-unmatch apps/browser-extension/entrypoints/popup/routeTree.gen.ts
          git diff --exit-code -- apps/browser-extension/entrypoints/popup/routeTree.gen.ts

      - name: Check format, lint, and types
        run: pnpm check

      - name: Test
        run: pnpm test:coverage

      - name: Test integration
        run: pnpm test:integration

      - name: Test built Chrome extension
        run: pnpm test:e2e

      - name: Build
        run: pnpm build

  deploy:
    name: deploy Worker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'dorayaki4369/currency-lens'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: worker-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://cl.dryk.net
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reject environment files
        run: |
          blocked_path="$(find . -path './.git' -prune -o \( -name '.env' -o -name '.env.*' -o -name '.dev.vars' -o -name '.dev.vars.*' \) ! -name '*.example' -print -quit)"
          if [[ -n "$blocked_path" ]]; then
            echo "::error title=Environment file in checkout::$blocked_path must not be present in the repository."
            exit 1
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Require the current main commit
        run: |
          main_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$main_sha" != "$GITHUB_SHA" ]]; then
            echo "::error title=Stale deployment source::$GITHUB_SHA is no longer the main HEAD ($main_sha). Deploy from the newest main run instead."
            exit 1
          fi

      - name: Deploy the Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [[ -z "$CLOUDFLARE_ACCOUNT_ID" || -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error title=Missing Cloudflare credentials::Configure the production environment secrets."
            exit 1
          fi

          pnpm --filter @cl/server run deploy
