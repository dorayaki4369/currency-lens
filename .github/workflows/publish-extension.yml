name: Publish browser extension

# A push to main releases the extension version from apps/browser-extension/package.json when
# its vMAJOR.MINOR.PATCH tag does not exist yet. A manual run validates main without uploading.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  checks: read
  contents: read

concurrency:
  group: browser-extension-publishing
  cancel-in-progress: false

jobs:
  preflight:
    name: verify Worker deployment and API contract
    if: github.ref == 'refs/heads/main' && github.repository == 'dorayaki4369/currency-lens'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      API_ENDPOINT: ${{ vars.API_ENDPOINT }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' }}
    outputs:
      mode: ${{ steps.validate-source.outputs.mode }}
      source_sha: ${{ steps.validate-source.outputs.sha }}
      version: ${{ steps.validate-source.outputs.version }}
    steps:
      - name: Check out the release
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Reject environment files
        run: |
          blocked_path="$(find . -path './.git' -prune -o \( -name '.env' -o -name '.env.*' -o -name '.dev.vars' -o -name '.dev.vars.*' \) ! -name '*.example' -print -quit)"
          if [[ -n "$blocked_path" ]]; then
            echo "::error title=Environment file in checkout::$blocked_path must not be present in the repository."
            exit 1
          fi

      - name: Require the API endpoint
        run: |
          if [[ -z "$API_ENDPOINT" ]]; then
            echo "::error title=Missing API endpoint::Configure the repository Actions variable API_ENDPOINT."
            exit 1
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Validate the release source
        id: validate-source
        run: |
          main_sha="$(git rev-parse refs/remotes/origin/main)"
          if [[ "$(git rev-parse HEAD)" != "$main_sha" ]]; then
            echo "::error title=Stale release source::Releases and dry runs must use the current main commit."
            exit 1
          fi

          version="$(node -p "require('./apps/browser-extension/package.json').version")"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error title=Invalid extension version::$version must be MAJOR.MINOR.PATCH for both stores."
            exit 1
          fi

          if [[ "$DRY_RUN" == "true" ]]; then
            mode="dry-run"
            echo "WXT will validate release artifacts and credential presence without uploading packages."
          elif git rev-parse --quiet --verify "refs/tags/v$version" >/dev/null; then
            mode="skip"
            echo "v$version is already released; nothing to submit."
          else
            # Check the release notes before submitting, because a failed record would leave the
            # stores ahead of the tags.
            .github/scripts/changelog-section.sh "$version" >/dev/null
            mode="release"
            echo "Releasing v$version from $main_sha."
          fi

          {
            echo "mode=$mode"
            echo "sha=$main_sha"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        if: steps.validate-source.outputs.mode != 'skip'
        run: pnpm install --frozen-lockfile

      - name: Wait for Worker and verify live API compatibility
        if: steps.validate-source.outputs.mode != 'skip'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.validate-source.outputs.sha }}
        run: node apps/browser-extension/scripts/verify-release-readiness.mjs

  publish:
    name: publish Chrome and Firefox packages
    if: needs.preflight.outputs.mode == 'release' || needs.preflight.outputs.mode == 'dry-run'
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # id-token lets the job exchange its GitHub OIDC token for a short-lived Google access token.
    permissions:
      contents: read
      id-token: write
    env:
      API_ENDPOINT: ${{ vars.API_ENDPOINT }}
      DRY_RUN: ${{ needs.preflight.outputs.mode == 'dry-run' }}
    steps:
      - name: Check out the release
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.preflight.outputs.source_sha }}

      - name: Reject environment files
        run: |
          blocked_path="$(find . -path './.git' -prune -o \( -name '.env' -o -name '.env.*' -o -name '.dev.vars' -o -name '.dev.vars.*' \) ! -name '*.example' -print -quit)"
          if [[ -n "$blocked_path" ]]; then
            echo "::error title=Environment file in checkout::$blocked_path must not be present in the repository."
            exit 1
          fi

      - name: Require repository publishing secrets
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          FIREFOX_EXTENSION_ID: ${{ secrets.FIREFOX_EXTENSION_ID }}
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
          CHROME_PUBLISHER_ID: ${{ vars.CHROME_PUBLISHER_ID }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
        run: |
          required_credentials=(
            CHROME_EXTENSION_ID
            FIREFOX_EXTENSION_ID
            FIREFOX_JWT_ISSUER
            FIREFOX_JWT_SECRET
          )

          missing_credentials=0
          for credential_name in "${required_credentials[@]}"; do
            if [[ -z "${!credential_name:-}" ]]; then
              echo "::error title=Missing repository secret::Configure the repository Actions secret $credential_name."
              missing_credentials=1
            fi
          done

          # These identify the Chrome Web Store publisher and the Google Cloud identity. They are
          # not secret, so they are repository variables.
          required_variables=(
            CHROME_PUBLISHER_ID
            GCP_WORKLOAD_IDENTITY_PROVIDER
            GCP_SERVICE_ACCOUNT
          )
          for variable_name in "${required_variables[@]}"; do
            if [[ -z "${!variable_name:-}" ]]; then
              echo "::error title=Missing repository variable::Configure the repository Actions variable $variable_name."
              missing_credentials=1
            fi
          done

          if (( missing_credentials != 0 )); then
            exit 1
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check format, lint, and types
        run: pnpm check

      - name: Test
        run: pnpm test

      # The Edge package is built here so that the GitHub Release keeps the exact ZIP that the
      # publish-edge job submits.
      - name: Build Chrome, Firefox, and Edge packages
        run: |
          pnpm --dir apps/browser-extension build
          pnpm --dir apps/browser-extension build:firefox
          pnpm --dir apps/browser-extension zip
          pnpm --dir apps/browser-extension zip:firefox
          pnpm --dir apps/browser-extension zip:edge

      - name: Validate release archives
        working-directory: apps/browser-extension
        run: |
          shopt -s nullglob
          chrome_archives=(.output/*-chrome.zip)
          firefox_archives=(.output/*-firefox.zip)
          source_archives=(.output/*-sources.zip)
          edge_archives=(.output/*-edge.zip)

          if (( ${#chrome_archives[@]} != 1 || ${#firefox_archives[@]} != 1 || ${#source_archives[@]} != 1 || ${#edge_archives[@]} != 1 )); then
            echo "::error title=Unexpected release artifacts::Expected one Chrome ZIP, one Firefox ZIP, one Firefox sources ZIP, and one Edge ZIP."
            exit 1
          fi

          for archive in "${chrome_archives[@]}" "${firefox_archives[@]}" "${source_archives[@]}" "${edge_archives[@]}"; do
            if unzip -Z1 "$archive" | grep -E '(^|/)(\.env|\.dev\.vars)($|\.|/)' >/dev/null; then
              echo "::error title=Secret file in archive::$archive contains an environment file."
              exit 1
            fi
          done

          if unzip -Z1 "${source_archives[0]}" | grep -E '(^|/)(node_modules|\.output|\.wxt)(/|$)' >/dev/null; then
            echo "::error title=Generated files in Firefox sources::The sources ZIP contains dependencies or generated output."
            exit 1
          fi

      - name: Rebuild Firefox from the submitted sources
        run: |
          shopt -s nullglob
          source_archives=(apps/browser-extension/.output/*-sources.zip)
          firefox_archives=(apps/browser-extension/.output/*-firefox.zip)
          source_root="$RUNNER_TEMP/firefox-sources"
          expected_root="$RUNNER_TEMP/firefox-expected"
          rebuilt_root="$RUNNER_TEMP/firefox-rebuilt"

          mkdir -p "$source_root" "$expected_root" "$rebuilt_root"
          unzip -q "${source_archives[0]}" -d "$source_root"

          required_source_files=(
            .node-version
            package.json
            pnpm-lock.yaml
            pnpm-workspace.yaml
            apps/browser-extension/package.json
            SOURCE_CODE_REVIEW.md
            packages/currency/package.json
          )
          for required_file in "${required_source_files[@]}"; do
            if [[ ! -f "$source_root/$required_file" ]]; then
              echo "::error title=Incomplete Firefox sources::$required_file is missing from the sources ZIP."
              exit 1
            fi
          done

          (
            cd "$source_root"
            pnpm install --frozen-lockfile
            pnpm --dir apps/browser-extension zip:firefox
          )

          rebuilt_archives=("$source_root"/apps/browser-extension/.output/*-firefox.zip)
          if (( ${#rebuilt_archives[@]} != 1 )); then
            echo "::error title=Unexpected rebuilt artifacts::Expected one rebuilt Firefox ZIP."
            exit 1
          fi

          unzip -q "${firefox_archives[0]}" -d "$expected_root"
          unzip -q "${rebuilt_archives[0]}" -d "$rebuilt_root"
          if ! diff --recursive --brief "$expected_root" "$rebuilt_root"; then
            echo "::error title=Non-reproducible Firefox build::The submitted sources do not reproduce the Firefox package."
            exit 1
          fi

      - name: Preserve release archives
        uses: actions/upload-artifact@v7.0.2
        with:
          name: browser-extension-${{ github.run_id }}
          path: apps/browser-extension/.output/*.zip
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          retention-days: 30

      # AMO keeps its listing separate from the manifest, so each release sends the listing too.
      - name: Build the AMO listing metadata
        run: node apps/browser-extension/store/amo-metadata.ts "$RUNNER_TEMP/amo-metadata.json"

      # Chrome Web Store API v2 accepts a service account token. The Workload Identity provider
      # trusts only main of this repository, and the token expires after an hour, so no long-lived
      # Google credential is stored. Dry runs get the token too: WXT then calls the read-only
      # fetchStatus, which proves the whole chain without uploading. docs/deployment.md describes
      # the Google Cloud setup that the repository variables point to.
      - name: Get a Chrome Web Store access token
        id: google-auth
        uses: google-github-actions/auth@v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          # Only the access token is used, so no credentials file is written to the workspace.
          create_credentials_file: false
          export_environment_variables: false

      - name: Submit packages with WXT
        working-directory: apps/browser-extension
        env:
          CHROME_API_VERSION: v2
          CHROME_PUBLISHER_ID: ${{ vars.CHROME_PUBLISHER_ID }}
          CHROME_SERVICE_ACCOUNT_ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          FIREFOX_EXTENSION_ID: ${{ secrets.FIREFOX_EXTENSION_ID }}
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
        run: |
          shopt -s nullglob
          chrome_archives=(.output/*-chrome.zip)
          firefox_archives=(.output/*-firefox.zip)
          source_archives=(.output/*-sources.zip)

          submit_arguments=(
            submit
            --chrome-zip "$PWD/${chrome_archives[0]}"
            --firefox-zip "$PWD/${firefox_archives[0]}"
            --firefox-sources-zip "$PWD/${source_archives[0]}"
            --firefox-amo-metadata-file "$RUNNER_TEMP/amo-metadata.json"
          )

          if [[ "$DRY_RUN" == "true" ]]; then
            submit_arguments+=(--dry-run)
          fi

          if [[ -e .env.submit ]]; then
            echo "::error title=Environment file before submission::.env.submit must not be present when WXT runs."
            exit 1
          fi

          pnpm run wxt -- "${submit_arguments[@]}"

  # Edge goes after Chrome and Firefox and outside the record job's needs, so an Edge failure never
  # blocks the tag that stops the next push from resubmitting the same version to the other stores.
  # After fixing the cause, rerun this job; it submits the ZIP preserved by the publish job.
  publish-edge:
    name: publish Edge package
    if: needs.preflight.outputs.mode == 'release' || needs.preflight.outputs.mode == 'dry-run'
    needs:
      - preflight
      - publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      API_ENDPOINT: ${{ vars.API_ENDPOINT }}
      DRY_RUN: ${{ needs.preflight.outputs.mode == 'dry-run' }}
    steps:
      # Edge accepts only updates through its API, so submission starts after the owner has
      # listed the extension by hand and registered all three secrets.
      - name: Check the Edge publishing secrets
        id: edge-credentials
        env:
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
        run: |
          required_credentials=(EDGE_PRODUCT_ID EDGE_CLIENT_ID EDGE_API_KEY)
          missing_credentials=()
          for credential_name in "${required_credentials[@]}"; do
            if [[ -z "${!credential_name:-}" ]]; then
              missing_credentials+=("$credential_name")
            fi
          done

          if (( ${#missing_credentials[@]} == ${#required_credentials[@]} )); then
            echo "::notice title=Edge publishing not configured::No Edge secrets are registered, so this run skips Microsoft Edge Add-ons."
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if (( ${#missing_credentials[@]} != 0 )); then
            for credential_name in "${missing_credentials[@]}"; do
              echo "::error title=Missing repository secret::Configure the repository Actions secret $credential_name."
            done
            exit 1
          fi

          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Check out the release
        if: steps.edge-credentials.outputs.configured == 'true'
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.preflight.outputs.source_sha }}

      - name: Reject environment files
        if: steps.edge-credentials.outputs.configured == 'true'
        run: |
          blocked_path="$(find . -path './.git' -prune -o \( -name '.env' -o -name '.env.*' -o -name '.dev.vars' -o -name '.dev.vars.*' \) ! -name '*.example' -print -quit)"
          if [[ -n "$blocked_path" ]]; then
            echo "::error title=Environment file in checkout::$blocked_path must not be present in the repository."
            exit 1
          fi

      - name: Install pnpm
        if: steps.edge-credentials.outputs.configured == 'true'
        uses: pnpm/action-setup@v6.1.1

      - name: Set up Node.js
        if: steps.edge-credentials.outputs.configured == 'true'
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        if: steps.edge-credentials.outputs.configured == 'true'
        run: pnpm install --frozen-lockfile

      - name: Download the release archives
        if: steps.edge-credentials.outputs.configured == 'true'
        uses: actions/download-artifact@v8.0.2
        with:
          name: browser-extension-${{ github.run_id }}
          path: ${{ runner.temp }}/release-archives

      - name: Submit the Edge package with WXT
        if: steps.edge-credentials.outputs.configured == 'true'
        working-directory: apps/browser-extension
        env:
          ARCHIVE_DIRECTORY: ${{ runner.temp }}/release-archives
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
        run: |
          shopt -s nullglob
          edge_archives=("$ARCHIVE_DIRECTORY"/*-edge.zip)
          if (( ${#edge_archives[@]} != 1 )); then
            echo "::error title=Unexpected release artifacts::Expected one Edge ZIP in the preserved archives."
            exit 1
          fi

          submit_arguments=(submit --edge-zip "${edge_archives[0]}")
          if [[ "$DRY_RUN" == "true" ]]; then
            submit_arguments+=(--dry-run)
          fi

          if [[ -e .env.submit ]]; then
            echo "::error title=Environment file before submission::.env.submit must not be present when WXT runs."
            exit 1
          fi

          pnpm run wxt -- "${submit_arguments[@]}"

  # The store listing images are uploaded by hand, so a failure here never blocks a release.
  promo-images:
    name: render store promo images
    if: needs.preflight.outputs.mode == 'release' || needs.preflight.outputs.mode == 'dry-run'
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      API_ENDPOINT: ${{ vars.API_ENDPOINT }}
    steps:
      - name: Check out the release
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.preflight.outputs.source_sha }}

      - name: Reject environment files
        run: |
          blocked_path="$(find . -path './.git' -prune -o \( -name '.env' -o -name '.env.*' -o -name '.dev.vars' -o -name '.dev.vars.*' \) ! -name '*.example' -print -quit)"
          if [[ -n "$blocked_path" ]]; then
            echo "::error title=Environment file in checkout::$blocked_path must not be present in the repository."
            exit 1
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The runner has no CJK font, so Chinese, Japanese, and Korean copy would render as boxes.
      - name: Install Chromium and CJK fonts
        run: |
          pnpm exec playwright install --with-deps chromium
          sudo apt-get install --yes --no-install-recommends fonts-noto-cjk

      - name: Save the review screenshots the images crop
        run: |
          pnpm test:integration apps/browser-extension/test/integration/localized-layout.spec.ts -t "store images"
          pnpm --dir apps/browser-extension build
          pnpm exec playwright test localized-extension

      - name: Render the promo images
        run: pnpm store:images

      - name: Preserve the promo images
        uses: actions/upload-artifact@v7.0.2
        with:
          name: store-promo-images-${{ github.run_id }}
          path: apps/browser-extension/.output/store-images/
          if-no-files-found: error
          retention-days: 30

  record:
    name: record the release on GitHub
    if: needs.preflight.outputs.mode == 'release'
    needs:
      - preflight
      - publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
      VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - name: Check out the release
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.preflight.outputs.source_sha }}

      - name: Download the submitted archives
        uses: actions/download-artifact@v8.0.2
        with:
          name: browser-extension-${{ github.run_id }}
          path: ${{ runner.temp }}/release-archives

      # A tag created with GITHUB_TOKEN starts no other workflow, so recording is the last step.
      - name: Create the tag and GitHub Release
        env:
          ARCHIVE_DIRECTORY: ${{ runner.temp }}/release-archives
          GH_TOKEN: ${{ github.token }}
        run: |
          notes_file="$RUNNER_TEMP/release-notes.md"
          .github/scripts/changelog-section.sh "$VERSION" > "$notes_file"

          shopt -s nullglob
          archives=("$ARCHIVE_DIRECTORY"/*.zip)
          gh release create "v$VERSION" "${archives[@]}" \
            --target "$SOURCE_SHA" \
            --title "v$VERSION" \
            --notes-file "$notes_file"
